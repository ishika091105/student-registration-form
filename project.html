
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    padding: 40px 10px;
  }

  .form-container {
    background-color: #ffffff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 25px 30px;
    width: 350px;
  }

  h2 {
    text-align: center;
    color: #333;
  }

  .photo {
    display: block;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px auto;
    border: 2px solid #999;
  }

  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-weight: bold;
    color: #333;
  }

  input, select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<div class="form-container">
  <h2>Student Registration Form</h2>

  <!-- Picture using URL -->
  <img class="photo" src="female-student-graduation-avatar-profile-vector-12055265.avif" alt="Student Photo">

  <form>
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="id">Student ID</label>
    <input type="text" id="id" placeholder="Enter student ID">

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter email">

    <label for="course">Course</label>
    <input type="text" id="course" placeholder="Enter course name">

    <label for="grade">Grade/Year</label>
    <select id="grade">
      <option>1st Year</option>
      <option>2nd Year</option>
      <option>3rd Year</option>
      <option>4th Year</option>
    </select>

    <button type="submit">Register</button>
  </form>
</div>

</body>
</html>
